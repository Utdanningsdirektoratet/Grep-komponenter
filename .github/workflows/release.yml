name: Release
on:
  push:
    branches:
      - master
      - 'feature/**'
      - 'bugfix/**'
    paths:
      - 'src/**'
      - 'package*'

  workflow_dispatch:
    inputs:
      args:
        description: 'CLI arguments'
        required: false
        default: ''

jobs:
  release:
    name: Release
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Release
        env:
          GITHUB_ARGS: ${{ github.event.inputs.args }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: 0
        run: npx semantic-release $GITHUB_ARGS
